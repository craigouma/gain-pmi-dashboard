name: Keep the dashboard awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  visit:
    runs-on: ubuntu-latest
    steps:
      - name: Visit the dashboard
        env:
          APP_URL: https://gain-pmi-dashboard.streamlit.app/
        run: |
          # Streamlit Cloud bootstraps a session cookie over several redirects, so a cookie jar is
          # required. Without one the request loops on the auth redirect even for a public app.
          jar=$(mktemp)
          status=$(curl --silent --show-error --location --cookie-jar "$jar" --cookie "$jar" \
            --max-redirs 10 --max-time 90 --output /dev/null --write-out '%{http_code}' "$APP_URL")
          echo "$APP_URL returned HTTP $status"
          if [ "$status" != "200" ]; then
            exit 1
          fi
